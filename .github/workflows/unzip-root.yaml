name: Unzip and Force Overwrite Root

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-overwrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List root files BEFORE extraction (Debug)
        run: ls -la

      - name: Extract zip files and force overwrite root
        run: |
          # پیدا کردن فایل‌های zip (بدون حساسیت به حروف بزرگ/کوچک)
          zip_files=$(find . -maxdepth 1 -type f -iname "*.zip")
          
          if [ -z "$zip_files" ]; then
            echo "❌ هیچ فایل زیپی در ریشه پیدا نشد."
            exit 0
          fi
          
          echo "✅ فایل‌های زیپ پیدا شدند: $zip_files"
          
          for zipfile in $zip_files; do
            echo "📦 در حال پردازش: $zipfile"
            
            # 1. استخراج به یک پوشه موقت
            temp_dir=$(mktemp -d)
            7z x "$zipfile" -o"$temp_dir" -y
            
            echo "📂 محتویات استخراج شده در پوشه موقت:"
            ls -la "$temp_dir"
            
            # 2. کپی تمام محتویات پوشه موقت به ریشه (با بازنویسی کامل)
            #    اگر زیپ شامل یک پوشه سطح بالا باشد، محتویات آن پوشه را به ریشه منتقل می‌کنیم
            #    تا فایل‌ها دقیقاً جایگزین فایل‌های هم‌نام در ریشه شوند.
            echo "🔄 در حال جایگزانی فایل‌ها در ریشه..."
            
            # بررسی می‌کنیم که آیا فقط یک پوشه در خروجی وجود دارد یا چند فایل/پوشه
            items_count=$(ls -1 "$temp_dir" | wc -l)
            if [ $items_count -eq 1 ] && [ -d "$temp_dir"/* ]; then
              # اگر فقط یک پوشه وجود داشت، محتویات آن را به ریشه منتقل می‌کنیم (Flat کردن)
              single_folder=$(ls -d "$temp_dir"/*)
              echo "📁 زیپ فقط یک پوشه دارد. محتویات $single_folder را به ریشه منتقل می‌کنیم..."
              rsync -av "$single_folder"/ ./
            else
              # در غیر این صورت، همه چیز را همان‌طور که هست به ریشه کپی می‌کنیم
              rsync -av "$temp_dir"/ ./
            fi
            
            # پاک کردن پوشه موقت
            rm -rf "$temp_dir"
            
            # حذف فایل زیپ اصلی تا دوباره استخراج نشود (اختیاری)
            rm -f "$zipfile"
            echo "✅ پردازش $zipfile به پایان رسید."
          done

      - name: List root files AFTER extraction (Debug)
        run: ls -la

      - name: Force commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # اضافه کردن همه تغییرات
          git add .
          
          # بررسی تغییرات
          if ! git diff --staged --quiet; then
            echo "✅ تغییرات شناسایی شد. در حال Commit..."
            branch_name="${GITHUB_REF_NAME:-main}"
            git commit -m "Force overwrite root with extracted zip contents"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:$branch_name
          else
            echo "⚠️ هیچ تغییر محتوایی شناسایی نشد."
            echo "برای اعمال جایگزانی اجباری (حتی با محتوای یکسان)، یک فایل dummy تغییر می‌دهیم..."
            
            # راه‌حل جایگزانی اجباری: ایجاد یک فایل موقت برای تغییر تاریخچه
            # (زیرا گاهی کاربر می‌خواهد تاریخچه commit به‌روز شود)
            touch .force_update
            git add .force_update
            branch_name="${GITHUB_REF_NAME:-main}"
            git commit -m "Force update: re-extract zip (overwrite identical files)"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:$branch_name
            
            # پاک کردن فایل موقت در Push بعدی (اختیاری)
            # اما برای این کار نیاز به دوباره Push داریم، پس بهتر است آن را نگه داریم.
          fi
