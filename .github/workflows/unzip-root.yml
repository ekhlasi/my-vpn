name: Unzip Root Archive

on:
  push:
    branches:
      - main
  workflow_dispatch:  # اجرای دستی

# اجازه‌ی نوشتن در مخزن
permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # برای اینکه بعداً بتوانیم push کنیم، توکن را تنظیم می‌کنیم
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract zip files in root (overwrite duplicates)
        run: |
          # بررسی وجود حداقل یک فایل zip در ریشه
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o "*.zip"
          else
            echo "No zip file found in root, skipping extraction."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Extract zip files into root (overwrite duplicates)"
            # استفاده از توکن برای push
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No changes to commit."
          fi
