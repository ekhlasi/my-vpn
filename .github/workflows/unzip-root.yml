name: Unzip Root Archive

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # ارتقا به نسخه‌ی v5 برای رفع اخطار Node.js
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List all files in root (for debug)
        run: |
          echo "Current directory: $(pwd)"
          echo "Files and folders in root:"
          ls -la

      - name: Extract all zip files in root (using 7z)
        run: |
          # بررسی وجود فایل zip
          if ls *.zip 1> /dev/null 2>&1; then
            for zipfile in *.zip; do
              echo "📦 Extracting $zipfile with 7z ..."
              # استخراج با 7z و بازنویسی فایل‌های تکراری
              7z x "$zipfile" -o. -y
              if [ $? -eq 0 ]; then
                echo "✅ Successfully extracted $zipfile"
              else
                echo "❌ Failed to extract $zipfile"
              fi
            done
          else
            echo "❌ No zip file found in root. Exiting."
            exit 0
          fi

      - name: Check for changes
        run: |
          git status
          git diff --staged --name-only

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            echo "✅ Changes detected, committing..."
            branch_name="${GITHUB_REF_NAME:-main}"
            git commit -m "Extract zip files into root (overwrite duplicates)"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:$branch_name
          else
            echo "ℹ️ No changes to commit."
          fi
