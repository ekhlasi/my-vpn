name: Unzip Root Archive

on:
  push:
    branches:
      - main
  workflow_dispatch:  # امکان اجرای دستی

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Find and extract all zip files in root
        run: |
          # اگر فایل زیپ خاصی مد نظر است، می‌توانید به جای *.zip نام دقیق را بنویسید
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # در صورتی که تغییری وجود نداشته باشد، commit انجام نمی‌شود
          if ! git diff --staged --quiet; then
            git commit -m "Extract zip files into root (overwrite duplicates)"
            git push
          else
            echo "No changes to commit."
          fi
